[build]
# Repo-scoped parallelism: 6 jobs on this 8-core/10GB box.
# Overrides machine-wide ~/.cargo/config.toml (jobs=3, set for the hermes
# OOM/page-flip incidents) for gray builds only — hermes is untouched.
# 6 keeps typical rustc RSS inside RAM with swap as backstop; drop to 4 if
# you ever see swap thrash with a loaded desktop.
jobs = 6
