[workspace]
resolver = "3"
members = [
    "crates/gray",
    "crates/gray-core",
    "crates/gray-cron",
    "crates/gray-gateway",
    "crates/gray-markdown",
    "crates/gray-provider",
    "crates/gray-session",
    "crates/gray-tools",
]

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "MIT"

[workspace.dependencies]
# Workspace crates
gray-core = { path = "crates/gray-core" }
gray-gateway = { path = "crates/gray-gateway" }
gray-cron = { path = "crates/gray-cron" }
gray-provider = { path = "crates/gray-provider" }
gray-tools = { path = "crates/gray-tools" }
gray-session = { path = "crates/gray-session" }

# External dependencies
tokio = { version = "1", features = ["full"] }
reqwest = { version = "0.12", default-features = false, features = ["json", "stream", "rustls-tls"] }
eventsource-stream = "0.2"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
thiserror = "2"
async-trait = "0.1"
anyhow = "1.0"
tokio-util = "0.7"
futures = "0.3"
clap = { version = "4", features = ["derive"] }
uuid = { version = "1", features = ["v4"] }
log = { version = "0.4", features = ["std"] }
crossterm = "0.28"
ratatui = "0.29"
arboard = "3"
image = "0.25"
tempfile = "3"
chrono = { version = "0.4", features = ["serde"] }
cron = "0.12"
fs2 = "0.4"
axum = { version = "0.7", features = ["json"] }
tower-http = { version = "0.6", features = ["limit", "cors"] }
tower = { version = "0.5" }
rusqlite = { version = "0.31", features = ["bundled"] }

