[workspace]
resolver = "3"
members = ["crates/*"]

[workspace.package]
version = "0.1.1"
edition = "2024"
license = "MIT"

[workspace.dependencies]
# Workspace crates
gray-core = { path = "crates/gray-core" }
gray-provider = { path = "crates/gray-provider" }
gray-tools = { path = "crates/gray-tools" }
gray-session = { path = "crates/gray-session" }

# External dependencies
tokio = { version = "1", features = ["full"] }
reqwest = { version = "0.12", default-features = false, features = ["json", "stream", "rustls-tls"] }
eventsource-stream = "0.2"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
thiserror = "2"
async-trait = "0.1"
anyhow = "1.0"
tokio-util = "0.7"
futures = "0.3"
clap = { version = "4", features = ["derive"] }
uuid = { version = "1", features = ["v4"] }
log = { version = "0.4", features = ["std"] }
crossterm = "0.28"
ratatui = "0.29"

