<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>gray</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; background: #0e1117; color: #e2e8f0; height: 100vh; display: flex; overflow: hidden; }
    #sidebar { width: 260px; background: #161b22; border-right: 1px solid #30363d; display: flex; flex-direction: column; flex-shrink: 0; }
    .sidebar-header { padding: 14px 16px; border-bottom: 1px solid #30363d; display: flex; justify-content: space-between; align-items: center; }
    .sidebar-header h1 { font-size: 16px; font-weight: 600; letter-spacing: 0.5px; }
    .btn-new { background: #238636; color: #fff; border: none; border-radius: 6px; padding: 5px 10px; font-size: 12px; cursor: pointer; font-weight: 500; }
    .btn-new:hover { background: #2ea043; }
    #session-list { flex: 1; overflow-y: auto; list-style: none; padding: 8px; }
    .session-item { display: flex; justify-content: space-between; align-items: center; padding: 8px 10px; border-radius: 6px; cursor: pointer; font-size: 13px; margin-bottom: 4px; color: #8b949e; }
    .session-item:hover, .session-item.active { background: #21262d; color: #c9d1d9; }
    .session-title { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; max-width: 180px; }
    .session-del { background: transparent; border: none; color: #8b949e; cursor: pointer; font-size: 14px; padding: 0 4px; }
    .session-del:hover { color: #f85149; }
    #main { flex: 1; display: flex; flex-direction: column; height: 100vh; }
    #messages { flex: 1; overflow-y: auto; padding: 24px; display: flex; flex-direction: column; gap: 16px; }
    .message { max-width: 800px; width: 100%; margin: 0 auto; line-height: 1.6; }
    .message.user { background: #1f242c; border: 1px solid #30363d; border-radius: 8px; padding: 12px 16px; align-self: flex-end; }
    .message.assistant { background: transparent; padding: 4px 16px; }
    .sender { font-size: 11px; font-weight: 600; text-transform: uppercase; letter-spacing: 0.5px; margin-bottom: 4px; color: #8b949e; }
    .msg-content { white-space: pre-wrap; word-break: break-word; font-size: 14px; }
    .tool-chip { display: inline-flex; align-items: center; background: #161b22; border: 1px solid #388bfd40; color: #58a6ff; font-family: monospace; font-size: 12px; padding: 2px 8px; border-radius: 12px; margin: 4px 4px 4px 0; }
    .error-text { color: #f85149; background: #3c1e1e; border: 1px solid #da3633; border-radius: 6px; padding: 6px 10px; margin: 4px 0; font-size: 13px; }
    #composer-container { padding: 16px 24px; border-top: 1px solid #30363d; background: #0e1117; }
    #composer-form { max-width: 800px; margin: 0 auto; display: flex; gap: 8px; }
    #composer-input { flex: 1; background: #161b22; border: 1px solid #30363d; border-radius: 8px; color: #c9d1d9; padding: 10px 14px; font-size: 14px; resize: none; min-height: 44px; max-height: 200px; outline: none; font-family: inherit; }
    #composer-input:focus { border-color: #58a6ff; }
    #send-btn { background: #238636; color: #fff; border: none; border-radius: 8px; padding: 0 16px; cursor: pointer; font-size: 14px; font-weight: 500; }
    #send-btn:hover { background: #2ea043; }
    #send-btn:disabled { opacity: 0.5; cursor: not-allowed; }
  </style>
</head>
<body>
  <div id="sidebar">
    <div class="sidebar-header">
      <h1>gray</h1>
      <button class="btn-new" id="new-chat-btn">+ New</button>
    </div>
    <ul id="session-list"></ul>
  </div>
  <div id="main">
    <div id="messages"></div>
    <div id="composer-container">
      <form id="composer-form">
        <textarea id="composer-input" rows="1" placeholder="Type a message... (Enter to send, Shift+Enter for newline)"></textarea>
        <button type="submit" id="send-btn">Send</button>
      </form>
    </div>
  </div>
  <script src="/main.js"></script>
</body>
</html>
