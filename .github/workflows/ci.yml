name: ci

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

# A newer push to a PR supersedes the run in flight: stop it instead of
# holding a macOS and a Windows runner for a result nobody will read. Pushes
# to main are grouped by sha, so every main commit keeps its own full run.
concurrency:
  group: ci-${{ github.event.pull_request.number || github.sha }}
  cancel-in-progress: true

env:
  # CI never attaches a debugger; workspace crates drop the line tables the
  # dev profile keeps for local work. Smaller objects link faster (Windows
  # PDBs especially) and shrink the cache. Panic messages still carry
  # file:line; only backtrace frames lose it.
  CARGO_PROFILE_DEV_DEBUG: 0

jobs:
  changes:
    # Docs-only changes (docs/, top-level *.md) cannot change the binary or a
    # test, so the Rust jobs below are skipped for them. A job skipped by `if`
    # reports success, so required checks still resolve. crates/gray/gray-skill.md
    # is compiled in and is deliberately NOT excluded.
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read
    outputs:
      code: ${{ steps.filter.outputs.code }}
    steps:
      - uses: actions/checkout@v4
      - uses: dorny/paths-filter@v3
        id: filter
        with:
          predicate-quantifier: every
          filters: |
            code:
              - '**'
              - '!docs/**'
              - '!*.md'

  test:
    needs: changes
    if: needs.changes.outputs.code == 'true'
    permissions:
      contents: read
      checks: write
    strategy:
      # A macOS failure must not cancel the independent Linux evidence.
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-nextest
      - uses: Swatinem/rust-cache@v2
        with:
          # PRs restore main's cache; only main writes it, so PR runs skip the
          # upload and never evict the cache every other branch starts from.
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - name: install ripgrep (grep tool + parity tests shell out to rg)
        shell: bash
        run: |
          if command -v rg >/dev/null; then rg --version; exit 0; fi
          if [ "$(uname)" = "Darwin" ]; then brew install ripgrep
          # The image's package lists usually have ripgrep already; pay for
          # `apt-get update` only when they do not.
          else sudo apt-get install -y -qq ripgrep \
            || { sudo apt-get update -qq && sudo apt-get install -y -qq ripgrep; }
          fi
          rg --version
      - if: matrix.os == 'ubuntu-latest'
        run: cargo fmt --check
      - run: cargo clippy --locked --workspace -- -D warnings
      # nextest runs every test in its own process, all binaries at once, and
      # --no-fail-fast reports each failure by name: a failure elsewhere cannot
      # hide the macOS cancellation regression evidence, which is why that
      # suite no longer needs a separate step ahead of this one.
      - name: Build the standalone memory plugin integration fixture
        shell: bash
        run: |
          git init "$RUNNER_TEMP/gray-memory"
          git -C "$RUNNER_TEMP/gray-memory" fetch --depth 1 https://github.com/vstaln/gray-memory.git 2ba5532fc3657eae1107e361e05e59e0df74d2bf
          git -C "$RUNNER_TEMP/gray-memory" checkout --detach FETCH_HEAD
          CARGO_BUILD_JOBS=4 cargo build --locked --manifest-path "$RUNNER_TEMP/gray-memory/Cargo.toml" --bin gray-memory
          echo "GRAY_MEMORY_TEST_BIN=$RUNNER_TEMP/gray-memory/target/debug/gray-memory" >> "$GITHUB_ENV"
      - name: Run workspace tests
        env:
          RUST_BACKTRACE: 1
        run: cargo nextest run --locked --workspace --profile ci
      # nextest does not run doctests. They are platform-neutral, so one OS is
      # enough.
      - if: matrix.os == 'ubuntu-latest'
        name: Run doctests
        run: cargo test --locked --workspace --doc
      - if: matrix.os == 'ubuntu-latest'
        uses: rustsec/audit-check@v2
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

  perf-floor:
    # The numbers gray sells itself on — one binary, a small dependency
    # surface, a fast start — had no gate, so they drifted on nobody's watch.
    # Every metric here is a ceiling that may only go down; a regression fails
    # the job and raising one is a reviewable baseline commit.
    needs: changes
    if: needs.changes.outputs.code == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          save-if: ${{ github.ref == 'refs/heads/main' }}
      # Dependency counts need no build at all, so they fail fast; the binary
      # size is measured only after the release build this job does anyway.
      - name: Dependency floor
        run: ./scripts/perf-floor.sh
      - name: Build the release binary the size floor measures
        run: cargo build --locked --release -p gray
      - name: Binary size floor
        run: ./scripts/perf-floor.sh
      - name: install ripgrep (the tool bench's grep lanes shell out to rg)
        shell: bash
        run: |
          sudo apt-get install -y -qq ripgrep \
            || { sudo apt-get update -qq && sudo apt-get install -y -qq ripgrep; }
          rg --version
      # A benchmark, not a correctness test: it is #[ignore]d so the test jobs
      # do not spend half a minute on it per OS, and it runs here instead,
      # off the critical path and against the release deps this job built.
      - name: Tool-call latency baseline
        run: cargo test --locked --release -p gray-tools --test tool_bench -- --ignored --nocapture

  installer-smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: python3 -m unittest discover -s dist/tests -v
      - name: install.sh end-to-end against a local repo (no network)
        shell: bash
        run: |
          FAKE=$RUNNER_TEMP/fakerepo; BIN=$RUNNER_TEMP/bin; mkdir -p "$FAKE" "$BIN"
          printf '#!/bin/sh\necho "gray 0.0.0-test"\n' > "$FAKE/gray"
          chmod +x "$FAKE/gray"
          (cd "$FAKE" && tar czf gray-stable-x86_64-linux.tar.gz gray && sha256sum gray-*.tar.gz > SHA256SUMS-stable)
          GRAY_CDN_URL="file://$FAKE" GRAY_INSTALL_DIR="$BIN" sh dist/install.sh
          "$BIN/gray" --version

  windows-runtime:
    # This is a runtime gate, not a Windows support announcement. The first
    # port must prove Git Bash timeout/cancel kills descendants before we
    # publish a native installer. Do not suppress failures with continue-on-error.
    needs: changes
    if: needs.changes.outputs.code == 'true'
    runs-on: windows-2025
    timeout-minutes: 60
    env:
      CARGO_BUILD_JOBS: 4
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-nextest
      - uses: Swatinem/rust-cache@v2
        with:
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - name: Configure explicit Git for Windows shell and isolated storage
        shell: pwsh
        run: |
          # Avoid System32 bash.exe (the WSL launcher). Git's usr/bin/sh.exe
          # also supplies sleep/printf for the identical Unix/Windows fixture.
          $shellDir = Join-Path $env:ProgramFiles 'Git\usr\bin'
          if (-not (Test-Path (Join-Path $shellDir 'sh.exe'))) {
            throw 'Git for Windows POSIX shell is required for native tests'
          }
          $shellDir >> $env:GITHUB_PATH
          "GRAY_BASH=$(Join-Path $shellDir 'sh.exe')" >> $env:GITHUB_ENV
          "GRAY_HOME=$(Join-Path $env:RUNNER_TEMP 'gray-test-home')" >> $env:GITHUB_ENV
      - name: Require ripgrep for the complete search-tool tests
        shell: pwsh
        run: |
          if (-not (Get-Command rg -ErrorAction SilentlyContinue)) {
            # The pinned release zip, checked against its published digest,
            # takes a couple of seconds; Chocolatey takes 12-25s. Any failure
            # on the fast path falls back to Chocolatey, never to no ripgrep.
            $ver = '14.1.1'
            $name = "ripgrep-$ver-x86_64-pc-windows-msvc"
            $base = "https://github.com/BurntSushi/ripgrep/releases/download/$ver/$name.zip"
            $zip = Join-Path $env:RUNNER_TEMP "$name.zip"
            $dir = Join-Path $env:RUNNER_TEMP $name
            try {
              Invoke-WebRequest -Uri $base -OutFile $zip
              $want = ((Invoke-WebRequest -Uri "$base.sha256").Content.ToString().Trim() -split '\s+')[0].ToLowerInvariant()
              $got = (Get-FileHash $zip -Algorithm SHA256).Hash.ToLowerInvariant()
              if ($got -ne $want) { throw "ripgrep zip digest $got != published $want" }
              Expand-Archive $zip -DestinationPath $env:RUNNER_TEMP -Force
              if (-not (Test-Path (Join-Path $dir 'rg.exe'))) { throw 'rg.exe missing from the release zip' }
              $dir >> $env:GITHUB_PATH
              $env:PATH = "$dir;$env:PATH"
            } catch {
              Write-Host "ripgrep release download failed ($_); falling back to Chocolatey"
              choco install ripgrep --yes --no-progress
              if ($LASTEXITCODE -ne 0) { throw 'ripgrep installation failed' }
            }
          }
          rg --version
      # Lint covers the native Windows cfg paths; the test build below compiles
      # every test target, so a separate `cargo check --all-targets` only
      # repeated that work.
      - name: Check native Windows lint paths
        run: cargo clippy --locked --workspace -- -D warnings
      - name: Build the standalone memory plugin integration fixture
        shell: bash
        run: |
          git init "$RUNNER_TEMP/gray-memory"
          git -C "$RUNNER_TEMP/gray-memory" fetch --depth 1 https://github.com/vstaln/gray-memory.git 2ba5532fc3657eae1107e361e05e59e0df74d2bf
          git -C "$RUNNER_TEMP/gray-memory" checkout --detach FETCH_HEAD
          cargo build --locked --manifest-path "$RUNNER_TEMP/gray-memory/Cargo.toml" --bin gray-memory
          echo "GRAY_MEMORY_TEST_BIN=$RUNNER_TEMP/gray-memory/target/debug/gray-memory.exe" >> "$GITHUB_ENV"
      - name: Run full native workspace tests (report every test)
        # One run of the complete suite. nextest reports each failing test by
        # name and keeps going, so the shell lifecycle, shell contract,
        # home_paths, windows_limits and working_directory suites each report
        # native evidence without their own steps re-running them first.
        env:
          RUST_BACKTRACE: 1
        run: cargo nextest run --locked --workspace --profile ci
      # The installer only places and verifies a binary; it never depends on
      # optimisation. The debug gray.exe the integration tests above already
      # built is exactly as good, and skips a 2-3 minute release build here.
      # Installer evidence is independent of workspace runtime failures.
      - name: Test native installer with PowerShell 7
        if: ${{ !cancelled() }}
        run: ./dist/tests/install-native.ps1 -Binary (Resolve-Path target/debug/gray.exe)
      - name: Test native installer with Windows PowerShell 5.1
        if: ${{ !cancelled() }}
        shell: powershell
        run: ./dist/tests/install-native.ps1 -Binary (Resolve-Path target/debug/gray.exe)

  windows-preview:
    # The downloadable native preview ZIP. A job of its own, so the 2-3 minute
    # release build runs beside the runtime gate instead of after it. The ZIP
    # is packaged only when this job's build and smoke test pass; it does not
    # wait on windows-runtime, so a red runtime gate (which still fails the
    # run) is what tells you not to trust a preview from that run.
    needs: changes
    if: needs.changes.outputs.code == 'true'
    runs-on: windows-2025
    timeout-minutes: 60
    env:
      CARGO_BUILD_JOBS: 4
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - name: Build native preview artifact (not a release)
        env:
          GRAY_CHANNEL: beta
        run: cargo build --locked --release -p gray
      - name: Smoke test the preview binary
        run: ./target/release/gray.exe --version
      - name: Package preview ZIP and checksum
        shell: pwsh
        run: |
          # CI artifacts only: never modify the production CDN or installer default.
          New-Item -ItemType Directory -Path native-package | Out-Null
          Copy-Item target/release/gray.exe, LICENSE, THIRD_PARTY_NOTICES.md native-package/
          $archive = 'gray-beta-x86_64-windows.zip'
          Compress-Archive native-package/* $archive
          $hash = (Get-FileHash $archive -Algorithm SHA256).Hash.ToLowerInvariant()
          "$hash  $archive" | Set-Content "$archive.sha256" -Encoding ascii
      - uses: actions/upload-artifact@v4
        with:
          name: windows-native-preview
          path: |
            gray-beta-x86_64-windows.zip
            gray-beta-x86_64-windows.zip.sha256
            dist/install-native.ps1
            dist/install.ps1
