name: ide

on:
  pull_request:
    paths:
      - 'crates/**'
      - '.github/workflows/ide.yml'
  push:
    branches: [main]
    paths:
      - 'crates/**'
      - '.github/workflows/ide.yml'

permissions:
  contents: read

concurrency:
  group: ide-${{ github.event.pull_request.number || github.sha }}
  cancel-in-progress: true

env:
  CARGO_PROFILE_DEV_DEBUG: 0
  CARGO_BUILD_JOBS: 4

jobs:
  e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    defaults:
      run:
        working-directory: crates/gray-ide
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: crates/gray-ide
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - name: Install GPUI and e2e dependencies
        working-directory: .
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq libxkbcommon-dev libxkbcommon-x11-dev libwayland-dev \
            libx11-xcb-dev libxcb1-dev libxcb-xkb-dev libfontconfig1-dev libfreetype-dev \
            libvulkan-dev mesa-vulkan-drivers libgl1-mesa-dri libegl1 libssl-dev libzstd-dev \
            libasound2-dev clang xvfb xdotool imagemagick fonts-dejavu-core git
      - name: Build the gray CLI used by the provider e2e test
        working-directory: .
        run: cargo build --locked -p gray
      - run: cargo fmt --check
      - run: cargo clippy --locked -- -D warnings
      - name: End-to-end tests against the real binary under Xvfb
        env:
          RUST_BACKTRACE: 1
        run: cargo test --locked --test e2e -- --test-threads=2
      - if: always()
        uses: actions/upload-artifact@v4
        with:
          name: gray-ide-e2e-screenshots
          path: crates/gray-ide/target/tmp/gray-e2e-screenshots
          if-no-files-found: ignore
