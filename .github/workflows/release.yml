name: release

# beta channel: every push to main rebuilds and redeploys gray.alignment.id/dl/gray-beta-*
# stable channel: pushing a tag v<version> (must match Cargo.toml) deploys
# gray-stable-* and creates a GitHub Release. Tags containing '-' (e.g.
# v0.2.0-beta.1) deploy the beta file instead — a pinned, named beta.
#
# Matrix mirrors codex-rs: macos runner builds both darwin targets,
# linux x86_64 via musl-tools, linux aarch64 via cross (docker).
#
# Atomic CDN deploy: each matrix leg uploads its tarball to a STAGING prefix
# (dl/.staging/<channel>/). The finalize job below moves the full set live and
# rewrites the latest-<channel>.txt manifest pointers LAST, then verifies every
# tarball + manifest over HTTP — readers never see a manifest pointing at a
# half-published set.
#
# Rollback: re-point the manifest at the previous set. Old tarballs are never
# deleted by deploy, so: echo '<prev-ver>' | ssh <host> "sudo tee
# /var/www/gray/dl/latest-<channel>.txt". scripts/deploy.sh (manual single-leg
# path) is NOT atomic — re-run the finalize job after any manual upload.

on:
  push:
    branches: [main]
    tags: ["v*"]

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build-deploy:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            target: x86_64-unknown-linux-musl
            plat: x86_64-linux
          - os: ubuntu-latest
            target: aarch64-unknown-linux-musl
            plat: aarch64-linux
          - os: macos-latest
            target: aarch64-apple-darwin
            plat: aarch64-darwin
          - os: macos-latest
            target: x86_64-apple-darwin
            plat: x86_64-darwin
    steps:
      - uses: actions/checkout@v4

      - name: resolve channel + version guard
        id: meta
        shell: bash
        run: |
          CARGO_VER=$(grep -m1 '^version' Cargo.toml | sed 's/.*"\(.*\)"/\1/')
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then
            TAG="${GITHUB_REF_NAME#v}"
            if [ "$TAG" != "$CARGO_VER" ]; then
              echo "::error::tag v$TAG does not match Cargo.toml version $CARGO_VER"
              exit 1
            fi
            case "$TAG" in *-*) echo "channel=beta" ;; *) echo "channel=stable" ;; esac >> "$GITHUB_OUTPUT"
          else
            echo "channel=beta" >> "$GITHUB_OUTPUT"
          fi

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.target }}

      - name: install musl-tools (x86_64 linux)
        if: matrix.plat == 'x86_64-linux'
        run: sudo apt-get update -qq && sudo apt-get install -y -qq musl-tools

      - name: install cross (arm64 musl needs a cross C compiler for ring's asm)
        if: matrix.plat == 'aarch64-linux'
        uses: taiki-e/install-action@v2
        with:
          tool: cross

      - name: build
        env:
          GRAY_CHANNEL: ${{ steps.meta.outputs.channel }}
        shell: bash
        run: |
          if [ "${{ matrix.plat }}" = "aarch64-linux" ]; then
            cross build --release --target ${{ matrix.target }}
          else
            cargo build --release --target ${{ matrix.target }}
          fi

      - name: smoke test (native platforms)
        if: matrix.plat == 'x86_64-linux' || matrix.plat == 'aarch64-darwin'
        run: ./target/${{ matrix.target }}/release/gray --version

      - name: package
        shell: bash
        run: |
          TAR=gray-${{ steps.meta.outputs.channel }}-${{ matrix.plat }}.tar.gz
          tar czf "$TAR" -C target/${{ matrix.target }}/release gray
          sha256sum "$TAR" > "SHA256SUMS-${{ matrix.plat }}"
          echo "TAR=$TAR" >> "$GITHUB_ENV"

      - uses: actions/upload-artifact@v4
        with:
          name: dist-${{ matrix.plat }}
          path: |
            gray-*.tar.gz
            SHA256SUMS-*

      - name: stage tarball on gray.alignment.id (manifest swaps last, in finalize)
        env:
          DEPLOY_KEY: ${{ secrets.DEPLOY_KEY }}
        shell: bash
        run: |
          [ -n "$DEPLOY_KEY" ] || { echo "::error::DEPLOY_KEY secret not set"; exit 1; }
          mkdir -p ~/.ssh ~/.config/gray-deploy
          install -m 600 /dev/null ~/.config/gray-deploy/key
          printf '%s\n' "$DEPLOY_KEY" > ~/.config/gray-deploy/key
          cat .github/deploy_known_hosts >> ~/.ssh/known_hosts
          CHANNEL="${{ steps.meta.outputs.channel }}"
          SSH="ssh -i ~/.config/gray-deploy/key -o StrictHostKeyChecking=yes -o BatchMode=yes opc@168.110.210.65"
          scp -i ~/.config/gray-deploy/key -o StrictHostKeyChecking=yes -o BatchMode=yes "$TAR" opc@168.110.210.65:/tmp/
          $SSH "sudo mkdir -p /var/www/gray/dl/.staging/$CHANNEL \
            && sudo install -m 644 /tmp/$TAR /var/www/gray/dl/.staging/$CHANNEL/$TAR \
            && rm -f /tmp/$TAR"

      - name: sync installers to gray.alignment.id (once)
        if: matrix.plat == 'x86_64-linux'
        env:
          DEPLOY_KEY: ${{ secrets.DEPLOY_KEY }}
        shell: bash
        run: |
          [ -n "$DEPLOY_KEY" ] || { echo "::error::DEPLOY_KEY secret not set"; exit 1; }
          mkdir -p ~/.ssh ~/.config/gray-deploy
          install -m 600 /dev/null ~/.config/gray-deploy/key
          printf '%s\n' "$DEPLOY_KEY" > ~/.config/gray-deploy/key
          cat .github/deploy_known_hosts >> ~/.ssh/known_hosts
          scp -i ~/.config/gray-deploy/key -o StrictHostKeyChecking=yes -o BatchMode=yes dist/install.sh dist/install.ps1 opc@168.110.210.65:/tmp/
          ssh -i ~/.config/gray-deploy/key -o StrictHostKeyChecking=yes -o BatchMode=yes opc@168.110.210.65 "sudo install -m 644 /tmp/install.sh /var/www/gray/install.sh && sudo install -m 644 /tmp/install.ps1 /var/www/gray/install.ps1 && rm -f /tmp/install.sh /tmp/install.ps1 && echo '✓ installers live: https://gray.alignment.id'"

  finalize:
    needs: build-deploy
    # No tag gate: beta (every main push) needs the manifest swap too.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: resolve channel
        id: meta
        shell: bash
        run: |
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then
            TAG="${GITHUB_REF_NAME#v}"
            case "$TAG" in *-*) echo "channel=beta" ;; *) echo "channel=stable" ;; esac >> "$GITHUB_OUTPUT"
          else
            echo "channel=beta" >> "$GITHUB_OUTPUT"
          fi
      - name: promote staged set live, swap manifest last
        env:
          DEPLOY_KEY: ${{ secrets.DEPLOY_KEY }}
        shell: bash
        run: |
          [ -n "$DEPLOY_KEY" ] || { echo "::error::DEPLOY_KEY secret not set"; exit 1; }
          mkdir -p ~/.ssh ~/.config/gray-deploy
          install -m 600 /dev/null ~/.config/gray-deploy/key
          printf '%s\n' "$DEPLOY_KEY" > ~/.config/gray-deploy/key
          cat .github/deploy_known_hosts >> ~/.ssh/known_hosts
          CHANNEL="${{ steps.meta.outputs.channel }}"
          VER=$(grep -m1 '^version' Cargo.toml | sed 's/.*"\(.*\)"/\1/')
          SSH="ssh -i ~/.config/gray-deploy/key -o StrictHostKeyChecking=yes -o BatchMode=yes opc@168.110.210.65"
          $SSH "sudo cp /var/www/gray/dl/.staging/$CHANNEL/gray-$CHANNEL-*.tar.gz /var/www/gray/dl/"
          echo "$VER" | $SSH "sudo tee /var/www/gray/dl/latest-$CHANNEL.txt > /dev/null"
          echo "✓ latest-$CHANNEL.txt = $VER"
          for f in gray-$CHANNEL-x86_64-linux.tar.gz gray-$CHANNEL-aarch64-linux.tar.gz gray-$CHANNEL-aarch64-darwin.tar.gz gray-$CHANNEL-x86_64-darwin.tar.gz latest-$CHANNEL.txt; do
            code=$(curl -s -o /dev/null -w "%{http_code}" --max-time 15 "https://gray.alignment.id/dl/$f")
            [ "$code" = "200" ] || { echo "deploy check failed: $f returned $code"; exit 1; }
          done
          echo "✓ live: https://gray.alignment.id/dl/latest-$CHANNEL.txt"

  publish:
    needs: build-deploy
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          path: dist-all
          merge-multiple: true
      - name: assemble sums + notes
        shell: bash
        run: |
          cat dist-all/SHA256SUMS-* > dist-all/SHA256SUMS
          (cd dist-all && sha256sum -c SHA256SUMS)
          TAG="${GITHUB_REF_NAME#v}"
          awk -v tag="$TAG" '/^## \[/{f=($0 ~ "^## \\[" tag "\\]")} f' CHANGELOG.md | sed '1d' > dist-all/NOTES.md
          [ -s dist-all/NOTES.md ] || { echo "::error::no CHANGELOG entry for $GITHUB_REF_NAME"; exit 1; }
      - name: create release once
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          PRERELEASE=""; case "$GITHUB_REF_NAME" in *-*) PRERELEASE="--prerelease" ;; esac
          gh release create "$GITHUB_REF_NAME" dist-all/gray-*.tar.gz dist-all/SHA256SUMS \
            $PRERELEASE --title "$GITHUB_REF_NAME" --notes-file dist-all/NOTES.md
      - name: sync sums + installers to CDN
        env:
          DEPLOY_KEY: ${{ secrets.DEPLOY_KEY }}
        shell: bash
        run: |
          [ -n "$DEPLOY_KEY" ] || { echo "::error::DEPLOY_KEY secret not set"; exit 1; }
          mkdir -p ~/.ssh ~/.config/gray-deploy
          install -m 600 /dev/null ~/.config/gray-deploy/key
          printf '%s\n' "$DEPLOY_KEY" > ~/.config/gray-deploy/key
          cat .github/deploy_known_hosts >> ~/.ssh/known_hosts
          scp -i ~/.config/gray-deploy/key -o StrictHostKeyChecking=yes -o BatchMode=yes dist-all/SHA256SUMS dist/install.sh dist/install.ps1 opc@168.110.210.65:/tmp/
          ssh -i ~/.config/gray-deploy/key -o StrictHostKeyChecking=yes -o BatchMode=yes opc@168.110.210.65 "sudo install -m 644 /tmp/SHA256SUMS /var/www/gray/dl/SHA256SUMS && sudo install -m 644 /tmp/install.sh /var/www/gray/install.sh && sudo install -m 644 /tmp/install.ps1 /var/www/gray/install.ps1 && rm -f /tmp/SHA256SUMS /tmp/install.sh /tmp/install.ps1 && echo '✓ sums + installers live: https://gray.alignment.id/dl/SHA256SUMS'"
