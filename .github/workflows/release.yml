name: release

# beta channel: every push to main rebuilds and redeploys gray.alignment.id/dl/gray-beta-*
# stable channel: pushing a tag v<version> (must match Cargo.toml) deploys
# gray-stable-* and creates a GitHub Release. Tags containing '-' (e.g.
# v0.2.0-beta.1) deploy the beta file instead — a pinned, named beta.
#
# Matrix mirrors codex-rs: macos runner builds both darwin targets,
# linux x86_64 via musl-tools, linux aarch64 via cross (docker).

on:
  push:
    branches: [main]
    tags: ["v*"]

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-deploy:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            target: x86_64-unknown-linux-musl
            plat: x86_64-linux
          - os: ubuntu-latest
            target: aarch64-unknown-linux-musl
            plat: aarch64-linux
          - os: macos-latest
            target: aarch64-apple-darwin
            plat: aarch64-darwin
          - os: macos-latest
            target: x86_64-apple-darwin
            plat: x86_64-darwin
    steps:
      - uses: actions/checkout@v4

      - name: resolve channel + version guard
        id: meta
        shell: bash
        run: |
          CARGO_VER=$(grep -m1 '^version' Cargo.toml | sed 's/.*"\(.*\)"/\1/')
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then
            TAG="${GITHUB_REF_NAME#v}"
            if [ "$TAG" != "$CARGO_VER" ]; then
              echo "::error::tag v$TAG does not match Cargo.toml version $CARGO_VER"
              exit 1
            fi
            case "$TAG" in *-*) echo "channel=beta" ;; *) echo "channel=stable" ;; esac >> "$GITHUB_OUTPUT"
          else
            echo "channel=beta" >> "$GITHUB_OUTPUT"
          fi

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.target }}

      - name: install musl-tools (x86_64 linux)
        if: matrix.plat == 'x86_64-linux'
        run: sudo apt-get update -qq && sudo apt-get install -y -qq musl-tools

      - name: install cross (arm64 musl needs a cross C compiler for ring's asm)
        if: matrix.plat == 'aarch64-linux'
        uses: taiki-e/install-action@v2
        with:
          tool: cross

      - name: build
        shell: bash
        run: |
          if [ "${{ matrix.plat }}" = "aarch64-linux" ]; then
            cross build --release --target ${{ matrix.target }}
          else
            cargo build --release --target ${{ matrix.target }}
          fi

      - name: smoke test (native platforms)
        if: matrix.plat == 'x86_64-linux' || matrix.plat == 'aarch64-darwin'
        run: ./target/${{ matrix.target }}/release/gray --version

      - name: package
        shell: bash
        run: |
          TAR=gray-${{ steps.meta.outputs.channel }}-${{ matrix.plat }}.tar.gz
          tar czf "$TAR" -C target/${{ matrix.target }}/release gray
          echo "TAR=$TAR" >> "$GITHUB_ENV"

      - name: github release (tags only)
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          PRERELEASE=""
          case "$GITHUB_REF_NAME" in *-*) PRERELEASE="--prerelease" ;; esac
          gh release create "$GITHUB_REF_NAME" "$TAR" $PRERELEASE --generate-notes 2>/dev/null \
            || gh release upload "$GITHUB_REF_NAME" "$TAR" --clobber

      - name: deploy to gray.alignment.id
        env:
          DEPLOY_KEY: ${{ secrets.DEPLOY_KEY }}
        shell: bash
        run: |
          [ -n "$DEPLOY_KEY" ] || { echo "::error::DEPLOY_KEY secret not set"; exit 1; }
          mkdir -p ~/.ssh ~/.config/gray-deploy
          install -m 600 /dev/null ~/.config/gray-deploy/key
          printf '%s\n' "$DEPLOY_KEY" > ~/.config/gray-deploy/key
          ssh-keyscan -H 168.110.210.65 >> ~/.ssh/known_hosts 2>/dev/null
          DEPLOY_KEY=~/.config/gray-deploy/key scripts/deploy.sh "$TAR"

  deploy-site:
    needs: build-deploy
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: web/pnpm-lock.yaml
      - name: build site
        run: |
          cd web
          pnpm install --frozen-lockfile
          pnpm build
      - name: deploy site to gray.alignment.id
        env:
          DEPLOY_KEY: ${{ secrets.DEPLOY_KEY }}
        shell: bash
        run: |
          [ -n "$DEPLOY_KEY" ] || { echo "::error::DEPLOY_KEY secret not set"; exit 1; }
          mkdir -p ~/.ssh ~/.config/gray-deploy
          install -m 600 /dev/null ~/.config/gray-deploy/key
          printf '%s\n' "$DEPLOY_KEY" > ~/.config/gray-deploy/key
          ssh-keyscan -H 168.110.210.65 >> ~/.ssh/known_hosts 2>/dev/null
          # the static export owns everything in the docroot except the
          # installer artifacts, which deploy-web.sh excludes and re-verifies
          DEPLOY_KEY=~/.config/gray-deploy/key scripts/deploy-web.sh
          # installers still ship straight from dist/
          scp -i ~/.config/gray-deploy/key -o StrictHostKeyChecking=accept-new -o BatchMode=yes dist/install.sh dist/install.ps1 opc@168.110.210.65:/tmp/
          ssh -i ~/.config/gray-deploy/key -o StrictHostKeyChecking=accept-new -o BatchMode=yes opc@168.110.210.65 "sudo install -m 644 /tmp/install.sh /var/www/gray/install.sh && sudo install -m 644 /tmp/install.ps1 /var/www/gray/install.ps1 && rm -f /tmp/install.sh /tmp/install.ps1 && echo '✓ site live: https://gray.alignment.id'"
