name: release

# beta channel: every push to main rebuilds and redeploys gray.alignment.id/dl/gray-beta-*
# stable channel: pushing a tag v<version> (must match Cargo.toml) deploys
# gray-stable-* and creates a GitHub Release. Tags containing '-' (e.g.
# v0.2.0-beta.1) deploy the beta file instead — a pinned, named beta.
#
# Matrix mirrors codex-rs: macos runner builds both darwin targets,
# linux x86_64 via musl-tools, linux aarch64 via cross (docker).
#
# Staged CDN deploy: each matrix leg uploads its tarball to a STAGING prefix
# (dl/.staging/<channel>/). The finalize job below moves the full set live and
# rewrites the latest-<channel>.txt manifest pointers LAST, then verifies every
# tarball + manifest over HTTP — readers never see a manifest pointing at a
# half-published set after the manifest swap. Downloads during promotion may retry.
#
# Rollback: re-point the manifest at the previous set. Old tarballs are never
# deleted by deploy, so: echo '<prev-ver>' | ssh <host> "sudo tee
# /var/www/gray/dl/latest-<channel>.txt". Manual single-leg uploads are
# NOT atomic — re-run the finalize job after any manual upload.

on:
  push:
    branches: [main]
    tags: ["v*"]

permissions:
  contents: write

concurrency:
  group: release-deploy
  cancel-in-progress: false

jobs:
  meta:
    runs-on: ubuntu-latest
    outputs:
      channel: ${{ steps.meta.outputs.channel }}
    steps:
      - uses: actions/checkout@v4
      - name: resolve channel + version guard
        id: meta
        shell: bash
        run: |
          CARGO_VER=$(grep -m1 '^version' Cargo.toml | sed 's/.*"\(.*\)"/\1/')
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then
            TAG="${GITHUB_REF_NAME#v}"
            if [ "$TAG" != "$CARGO_VER" ]; then
              echo "::error::tag v$TAG does not match Cargo.toml version $CARGO_VER"
              exit 1
            fi
            case "$TAG" in *-*) echo "channel=beta" ;; *) echo "channel=stable" ;; esac >> "$GITHUB_OUTPUT"
          else
            echo "channel=beta" >> "$GITHUB_OUTPUT"
          fi

  build-deploy:
    needs: meta
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            target: x86_64-unknown-linux-musl
            plat: x86_64-linux
          - os: ubuntu-latest
            target: aarch64-unknown-linux-musl
            plat: aarch64-linux
          - os: macos-latest
            target: aarch64-apple-darwin
            plat: aarch64-darwin
          - os: macos-latest
            target: x86_64-apple-darwin
            plat: x86_64-darwin
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.target }}

      - name: install musl-tools (x86_64 linux)
        if: matrix.plat == 'x86_64-linux'
        run: sudo apt-get update -qq && sudo apt-get install -y -qq musl-tools

      - name: install cross (arm64 musl needs a cross C compiler for ring's asm)
        if: matrix.plat == 'aarch64-linux'
        uses: taiki-e/install-action@v2
        with:
          tool: cross

      - name: build
        env:
          GRAY_CHANNEL: ${{ needs.meta.outputs.channel }}
          GRAY_BUILD_ID: ${{ github.sha }}
        shell: bash
        run: |
          # Single binary. No gateway features exist anymore.
          if [ "${{ matrix.plat }}" = "aarch64-linux" ]; then
            cross build --release -p gray --target ${{ matrix.target }}
          else
            cargo build --release -p gray --target ${{ matrix.target }}
          fi

      - name: smoke test (native platforms)
        if: matrix.plat == 'x86_64-linux' || matrix.plat == 'aarch64-darwin'
        run: ./target/${{ matrix.target }}/release/gray --version

      - name: artifact identity
        shell: bash
        run: |
          # The un-smoked legs (x86_64-darwin, aarch64-linux) get no execution
          # check at all; assert the packaged binary is the claimed
          # architecture for every leg instead (audit F6).
          case "${{ matrix.plat }}" in
            x86_64-linux) want="x86-64" ;;
            aarch64-linux) want="aarch64" ;;
            aarch64-darwin) want="arm64" ;;
            x86_64-darwin) want="x86_64" ;;
            *) want="" ;;
          esac
          [ -n "$want" ] || { echo "::error::no expected arch for ${{ matrix.plat }}"; exit 1; }
          file target/${{ matrix.target }}/release/gray
          file target/${{ matrix.target }}/release/gray | grep -q "$want" \
            || { echo "::error::artifact for ${{ matrix.plat }} is not $want"; exit 1; }

      - name: package
        shell: bash
        run: |
          TAR=gray-${{ needs.meta.outputs.channel }}-${{ matrix.plat }}.tar.gz
          tar czf "$TAR" -C target/${{ matrix.target }}/release gray
          sha256sum "$TAR" > "SHA256SUMS-${{ matrix.plat }}"
          echo "TAR=$TAR" >> "$GITHUB_ENV"

      - uses: actions/upload-artifact@v4
        with:
          name: dist-${{ matrix.plat }}
          path: |
            gray-*.tar.gz
            SHA256SUMS-*

      - uses: ./.github/actions/deploy-key
        with:
          key: ${{ secrets.DEPLOY_KEY }}

      - name: stage tarball on gray.alignment.id (manifest swaps last, in finalize)
        shell: bash
        run: |
          CHANNEL="${{ needs.meta.outputs.channel }}"
          SSH="ssh -i ~/.config/gray-deploy/key -o StrictHostKeyChecking=yes -o BatchMode=yes opc@168.110.210.65"
          scp -i ~/.config/gray-deploy/key -o StrictHostKeyChecking=yes -o BatchMode=yes "$TAR" "SHA256SUMS-${{ matrix.plat }}" opc@168.110.210.65:/tmp/
          $SSH "sudo mkdir -p /var/www/gray/dl/.staging/$CHANNEL/${{ github.run_id }} \
            && sudo install -m 644 /tmp/$TAR /var/www/gray/dl/.staging/$CHANNEL/${{ github.run_id }}/$TAR \
            && sudo install -m 644 /tmp/SHA256SUMS-${{ matrix.plat }} /var/www/gray/dl/.staging/$CHANNEL/${{ github.run_id }}/SHA256SUMS-${{ matrix.plat }} \
            && rm -f /tmp/$TAR /tmp/SHA256SUMS-${{ matrix.plat }}"


  # Windows ships a .zip (PowerShell packaging + Get-FileHash), so it cannot
  # join the tar/sha256sum matrix above. Same channel, same staging prefix,
  # same manifest-last promotion -- finalize and publish treat it as one more
  # platform in the set.
  windows-release:
    needs: meta
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-msvc
      - uses: Swatinem/rust-cache@v2
        with:
          key: x86_64-pc-windows-msvc

      - name: build
        env:
          GRAY_CHANNEL: ${{ needs.meta.outputs.channel }}
          GRAY_BUILD_ID: ${{ github.sha }}
        shell: bash
        run: cargo build --release -p gray --target x86_64-pc-windows-msvc

      - name: smoke test
        shell: bash
        run: ./target/x86_64-pc-windows-msvc/release/gray.exe --version

      - name: package zip + checksum
        shell: pwsh
        run: |
          $plat = 'x86_64-windows'
          $zip = "gray-${{ needs.meta.outputs.channel }}-$plat.zip"
          New-Item -ItemType Directory -Path pkg -Force | Out-Null
          Copy-Item target/x86_64-pc-windows-msvc/release/gray.exe, LICENSE, THIRD_PARTY_NOTICES.md pkg/
          if (Test-Path $zip) { Remove-Item $zip }
          # install-native.ps1 rejects any entry that is not one of these three
          # names at the archive root, so the staging dir must not be the source.
          # The wildcard has to be relative -- `-Path <abs>/*` is not a valid
          # PowerShell wildcard and fails with "a positional parameter cannot be
          # found that accepts argument '/*'". Same form ci.yml already tests.
          Compress-Archive -Path pkg/* -DestinationPath $zip
          # Lowercase and two spaces: the Linux finalize leg runs `sha256sum -c`
          # over the concatenated file, which rejects uppercase hex.
          $hash = (Get-FileHash $zip -Algorithm SHA256).Hash.ToLowerInvariant()
          "$hash  $zip" | Set-Content "SHA256SUMS-$plat" -Encoding ascii
          "TAR=$zip" >> $env:GITHUB_ENV
          Get-Content "SHA256SUMS-$plat"

      - uses: actions/upload-artifact@v4
        with:
          name: dist-x86_64-windows
          path: |
            gray-*.zip
            SHA256SUMS-*

      - uses: ./.github/actions/deploy-key
        with:
          key: ${{ secrets.DEPLOY_KEY }}

      - name: stage zip on gray.alignment.id (manifest swaps last, in finalize)
        shell: bash
        run: |
          CHANNEL="${{ needs.meta.outputs.channel }}"
          SSH="ssh -i ~/.config/gray-deploy/key -o StrictHostKeyChecking=yes -o BatchMode=yes opc@168.110.210.65"
          scp -i ~/.config/gray-deploy/key -o StrictHostKeyChecking=yes -o BatchMode=yes "$TAR" "SHA256SUMS-x86_64-windows" opc@168.110.210.65:/tmp/
          $SSH "sudo mkdir -p /var/www/gray/dl/.staging/$CHANNEL/${{ github.run_id }} \
            && sudo install -m 644 /tmp/$TAR /var/www/gray/dl/.staging/$CHANNEL/${{ github.run_id }}/$TAR \
            && sudo install -m 644 /tmp/SHA256SUMS-x86_64-windows /var/www/gray/dl/.staging/$CHANNEL/${{ github.run_id }}/SHA256SUMS-x86_64-windows \
            && rm -f /tmp/$TAR /tmp/SHA256SUMS-x86_64-windows"


  finalize:
    needs: [meta, build-deploy, windows-release]
    # No tag gate: beta (every main push) needs the manifest swap too.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/deploy-key
        with:
          key: ${{ secrets.DEPLOY_KEY }}
      - name: promote staged set live, swap manifest last
        shell: bash
        run: |
          CHANNEL="${{ needs.meta.outputs.channel }}"
          VER=$(grep -m1 '^version' Cargo.toml | sed 's/.*"\(.*\)"/\1/')
          SSH="ssh -i ~/.config/gray-deploy/key -o StrictHostKeyChecking=yes -o BatchMode=yes opc@168.110.210.65"
          $SSH "cd /var/www/gray/dl/.staging/$CHANNEL/${{ github.run_id }} && cat SHA256SUMS-* > /tmp/SHA256SUMS-$CHANNEL && sha256sum -c /tmp/SHA256SUMS-$CHANNEL && sudo install -m 644 /tmp/SHA256SUMS-$CHANNEL /var/www/gray/dl/SHA256SUMS-$CHANNEL"
          $SSH "sudo cp /var/www/gray/dl/.staging/$CHANNEL/${{ github.run_id }}/gray-$CHANNEL-*.tar.gz /var/www/gray/dl/ && sudo cp /var/www/gray/dl/.staging/$CHANNEL/${{ github.run_id }}/gray-$CHANNEL-*.zip /var/www/gray/dl/"
          scp -i ~/.config/gray-deploy/key -o StrictHostKeyChecking=yes -o BatchMode=yes dist/install.sh dist/install.ps1 opc@168.110.210.65:/tmp/
          $SSH "sudo install -m 644 /tmp/install.sh /var/www/gray/install.sh && sudo install -m 644 /tmp/install.ps1 /var/www/gray/install.ps1"
          echo "${{ github.sha }}" | $SSH "sudo tee /var/www/gray/dl/latest-$CHANNEL-build.txt > /dev/null"
          echo "$VER" | $SSH "sudo tee /var/www/gray/dl/latest-$CHANNEL.txt > /dev/null"
          echo "✓ latest-$CHANNEL.txt = $VER"
          for f in gray-$CHANNEL-x86_64-linux.tar.gz gray-$CHANNEL-aarch64-linux.tar.gz gray-$CHANNEL-aarch64-darwin.tar.gz gray-$CHANNEL-x86_64-darwin.tar.gz gray-$CHANNEL-x86_64-windows.zip latest-$CHANNEL.txt SHA256SUMS-$CHANNEL latest-$CHANNEL-build.txt; do
            if ! code=$(curl -sI -o /dev/null -w "%{http_code}" --retry 3 --retry-all-errors --max-time 30 "https://gray.alignment.id/dl/$f"); then
              echo "deploy published but verification failed: $f (curl transport error)"; exit 1
            fi
            [ "$code" = "200" ] || { echo "deploy check failed: $f returned $code"; exit 1; }
          done
          echo "✓ live: https://gray.alignment.id/dl/latest-$CHANNEL.txt"

  publish:
    needs: [build-deploy, windows-release, finalize]
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/deploy-key
        with:
          key: ${{ secrets.DEPLOY_KEY }}
      - uses: actions/download-artifact@v4
        with:
          path: dist-all
          merge-multiple: true
      - name: assemble sums + notes
        shell: bash
        run: |
          cat dist-all/SHA256SUMS-* > dist-all/SHA256SUMS
          (cd dist-all && sha256sum -c SHA256SUMS)
          TAG="${GITHUB_REF_NAME#v}"
          awk -v tag="$TAG" '/^## \[/{f=($0 ~ "^## \\[" tag "\\]")} f' CHANGELOG.md | sed '1d' > dist-all/NOTES.md
          [ -s dist-all/NOTES.md ] || { echo "::error::no CHANGELOG entry for $GITHUB_REF_NAME"; exit 1; }
      - name: create release once
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          PRERELEASE=""; case "$GITHUB_REF_NAME" in *-*) PRERELEASE="--prerelease" ;; esac
          gh release create "$GITHUB_REF_NAME" dist-all/gray-*.tar.gz dist-all/gray-*.zip dist-all/SHA256SUMS \
            $PRERELEASE --title "$GITHUB_REF_NAME" --notes-file dist-all/NOTES.md
      - name: sync sums + installers to CDN
        shell: bash
        run: |
          case "$GITHUB_REF_NAME" in *-*) CHANNEL=beta ;; *) CHANNEL=stable ;; esac
          cp dist-all/SHA256SUMS "dist-all/SHA256SUMS-$CHANNEL"
          scp -i ~/.config/gray-deploy/key -o StrictHostKeyChecking=yes -o BatchMode=yes dist-all/SHA256SUMS "dist-all/SHA256SUMS-$CHANNEL" dist/install.sh dist/install.ps1 opc@168.110.210.65:/tmp/
          ssh -i ~/.config/gray-deploy/key -o StrictHostKeyChecking=yes -o BatchMode=yes opc@168.110.210.65 "sudo install -m 644 /tmp/SHA256SUMS /var/www/gray/dl/SHA256SUMS && sudo install -m 644 /tmp/SHA256SUMS-$CHANNEL /var/www/gray/dl/SHA256SUMS-$CHANNEL && sudo install -m 644 /tmp/install.sh /var/www/gray/install.sh && sudo install -m 644 /tmp/install.ps1 /var/www/gray/install.ps1 && rm -f /tmp/SHA256SUMS /tmp/SHA256SUMS-$CHANNEL /tmp/install.sh /tmp/install.ps1 && echo '✓ sums + installers live: https://gray.alignment.id/dl/SHA256SUMS-'"$CHANNEL
