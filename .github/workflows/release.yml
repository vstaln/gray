name: release

# beta channel: every push to main rebuilds and redeploys gray.alignment.id/dl/gray-beta-*
# stable channel: pushing a tag v<version> (must match Cargo.toml) deploys
# gray-stable-* and creates a GitHub Release. Tags containing '-' (e.g.
# v0.2.0-beta.1) deploy the beta file instead — a pinned, named beta.

on:
  push:
    branches: [main]
    tags: ["v*"]

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: resolve channel + version guard
        id: meta
        run: |
          CARGO_VER=$(grep -m1 '^version' Cargo.toml | sed 's/.*"\(.*\)"/\1/')
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then
            TAG="${GITHUB_REF_NAME#v}"
            if [ "$TAG" != "$CARGO_VER" ]; then
              echo "::error::tag v$TAG does not match Cargo.toml version $CARGO_VER"
              exit 1
            fi
            # tags with a prerelease suffix (-beta.1 etc.) go to the beta channel
            case "$TAG" in *-*) echo "channel=beta" ;; *) echo "channel=stable" ;; esac >> "$GITHUB_OUTPUT"
            echo "version=$CARGO_VER" >> "$GITHUB_OUTPUT"
          else
            echo "channel=beta" >> "$GITHUB_OUTPUT"
            echo "version=$CARGO_VER-beta.$(git rev-parse --short HEAD)" >> "$GITHUB_OUTPUT"
          fi

      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2

      - name: install musl tools
        run: sudo apt-get update -qq && sudo apt-get install -y -qq musl-tools

      - name: build (static musl binary)
        run: |
          rustup target add x86_64-unknown-linux-musl
          cargo build --release --target x86_64-unknown-linux-musl

      - name: smoke test
        run: ./target/x86_64-unknown-linux-musl/release/gray --version

      - name: package
        run: |
          tar czf gray-${{ steps.meta.outputs.channel }}-x86_64-linux.tar.gz \
            -C target/x86_64-unknown-linux-musl/release gray

      - name: github release (tags only)
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          PRERELEASE=""
          case "$GITHUB_REF_NAME" in *-*) PRERELEASE="--prerelease" ;; esac
          gh release create "$GITHUB_REF_NAME" \
            "gray-${{ steps.meta.outputs.channel }}-x86_64-linux.tar.gz#gray-${CARGO_VER:-${{ steps.meta.outputs.version }}}-x86_64-linux.tar.gz" \
            $PRERELEASE --generate-notes || \
            gh release upload "$GITHUB_REF_NAME" "gray-${{ steps.meta.outputs.channel }}-x86_64-linux.tar.gz" --clobber

      - name: deploy to gray.alignment.id
        env:
          DEPLOY_KEY: ${{ secrets.DEPLOY_KEY }}
        run: |
          [ -n "$DEPLOY_KEY" ] || { echo "::error::DEPLOY_KEY secret not set"; exit 1; }
          mkdir -p ~/.ssh ~/.config/gray-deploy
          install -m 600 /dev/null ~/.config/gray-deploy/key
          printf '%s\n' "$DEPLOY_KEY" > ~/.config/gray-deploy/key
          ssh-keyscan -H 168.110.210.65 >> ~/.ssh/known_hosts 2>/dev/null
          DEPLOY_KEY=~/.config/gray-deploy/key scripts/deploy.sh "${{ steps.meta.outputs.channel }}" \
            "gray-${{ steps.meta.outputs.channel }}-x86_64-linux.tar.gz"
