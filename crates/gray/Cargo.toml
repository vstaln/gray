[package]
name = "gray"
default-run = "gray"
version.workspace = true
edition.workspace = true
description = "gray — a minimal, modular agent harness in Rust."
license.workspace = true

[lib]
name = "gray"
path = "src/lib.rs"

[[bin]]
name = "gray"
path = "src/main.rs"

[dependencies]
shlex = "2"
gray-core = { workspace = true }
gray-plugin = { workspace = true }
gray-pkg = { workspace = true }
gray-tools = { workspace = true }
gray-markdown = { workspace = true }
anyhow = { workspace = true }
clap = { workspace = true }
crossterm = { workspace = true }
ratatui = { workspace = true }
futures = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
tokio = { workspace = true }
tokio-util = { workspace = true }
reqwest = { workspace = true }
chrono = { workspace = true }
cron = { workspace = true }
thiserror = { workspace = true }
uuid = { workspace = true }
log = { workspace = true }
percent-encoding = { workspace = true }
image = { workspace = true }
tempfile = { workspace = true }
base64 = { workspace = true }
async-trait = { workspace = true }
libc = { workspace = true }
# Gateway host only (lifecycle/socket/ticker): messaging adapters stay out of the binary.
unicode-width = { workspace = true }
ignore = { workspace = true }

