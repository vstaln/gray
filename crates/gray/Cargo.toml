[package]
name = "gray"
version.workspace = true
edition.workspace = true
description = "gray — a minimal, modular agent harness in Rust."
license.workspace = true

[lib]
name = "gray"
path = "src/lib.rs"

[[bin]]
name = "gray"
path = "src/main.rs"

[dependencies]
gray-acp = { workspace = true, optional = true }
gray-core = { workspace = true }
gray-plugin = { workspace = true }
gray-pkg = { workspace = true }
gray-tools = { workspace = true }
gray-session = { workspace = true }
gray-markdown = { workspace = true }
anyhow = { workspace = true }
clap = { workspace = true }
crossterm = { workspace = true }
ratatui = { workspace = true }
futures = { workspace = true }
fs2 = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
tokio = { workspace = true }
tokio-util = { workspace = true }
reqwest = { workspace = true }
chrono = { workspace = true }
uuid = { workspace = true }
log = { workspace = true }
percent-encoding = { workspace = true }
arboard = { workspace = true, optional = true }
image = { workspace = true, optional = true }
tempfile = { workspace = true }
base64 = { workspace = true }
async-trait = { workspace = true }
# Phase 1 scope cut: the harness core ships no platform adapters.
unicode-width = { workspace = true }
ignore = { workspace = true }

[features]
default = []
# External agents over the Agent Client Protocol (`/acp`, `--acp`). Off by
# default: the default graph carries no ACP client.
acp = ["dep:gray-acp"]
# Clipboard/image attachments (arboard + image). Off by default to keep the
# default tree and binary lean; build with --features clipboard for paste.
clipboard = ["dep:arboard", "dep:image"]
