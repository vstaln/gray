[package]
name = "gray"
version.workspace = true
edition.workspace = true
description = "gray — a minimal, modular agent harness in Rust."
license.workspace = true

[lib]
name = "gray"
path = "src/lib.rs"

[[bin]]
name = "gray"
path = "src/main.rs"

[dependencies]
gray-core = { workspace = true }
gray-provider = { workspace = true }
gray-tools = { workspace = true }
gray-cron = { workspace = true }
gray-session = { workspace = true }
gray-markdown = { path = "../gray-markdown" }
anyhow = { workspace = true }
clap = { workspace = true }
crossterm = { workspace = true }
ratatui = { workspace = true }
futures = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
tokio = { workspace = true }
tokio-util = { workspace = true }
reqwest = { workspace = true }
chrono = { workspace = true }
uuid = { workspace = true }
log = { workspace = true }
arboard = { workspace = true }
image = { workspace = true }
tempfile = { workspace = true }
axum = { workspace = true }
tower-http = { workspace = true }
tower = { version = "0.5" }
async-trait = { workspace = true }
gray-gateway = { workspace = true }
sha2 = { workspace = true }
base64 = { workspace = true }
percent-encoding = { workspace = true }
unicode-width = { workspace = true }
ignore = { workspace = true }

[dev-dependencies]
async-trait = { workspace = true }
reqwest = { workspace = true }
tempfile = "3"
