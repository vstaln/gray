[package]
name = "gray"
default-run = "gray"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
description = "gray — a minimal, modular agent harness in Rust."
license.workspace = true

[lib]
name = "gray"
path = "src/lib.rs"

[[bin]]
name = "gray"
path = "src/main.rs"

[dependencies]
shlex = "2"
gray-core = { workspace = true }
gray-plugin = { workspace = true }
gray-pkg = { workspace = true }
gray-provider = { workspace = true }
gray-tools = { workspace = true }
gray-markdown = { workspace = true }
anyhow = { workspace = true }
clap = { workspace = true }
crossterm = { workspace = true }
ratatui = { workspace = true }
futures = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
sha2 = { workspace = true }
tokio = { workspace = true }
tokio-util = { workspace = true }
reqwest = { workspace = true }
chrono = { workspace = true }
cron = { workspace = true }
thiserror = { workspace = true }
uuid = { workspace = true }
log = { workspace = true }
percent-encoding = { workspace = true }
image = { workspace = true }
tempfile = { workspace = true }
base64 = { workspace = true }
async-trait = { workspace = true }
libc = { workspace = true }
unicode-width = { workspace = true }
ignore = { workspace = true }
regex = { workspace = true }


[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = ["Win32_Foundation", "Win32_System_Threading"] }

[dev-dependencies]
codex-auth = { path = "../../plugins/codex-auth" }
claude-sub = { path = "../../plugins/claude-sub" }
