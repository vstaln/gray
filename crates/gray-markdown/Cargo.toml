[package]
name = "gray-markdown"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "Streaming markdown renderer for gray (vendored from xai-grok-markdown)"

[dependencies]
anstyle = "1.0"
anstyle-lossy = "1.1.4"
anstyle-syntect = "1.0.4"
html-escape = "0.2"
linkify = "0.10"
pulldown-cmark = "0.13"
ratatui = { workspace = true }
supports-color = "3.0"
syntect = "5.3"
two-face = { version = "0.4", default-features = false, features = ["syntect-fancy"] }
textwrap = "0.16"
unicode-segmentation = "1.12.0"
unicode-width = "0.2"
url = "2"

[dev-dependencies]
pretty_assertions = "1"

[lints.rust]
unexpected_cfgs = { level = "warn", check-cfg = ['cfg(fuzzing)'] }
