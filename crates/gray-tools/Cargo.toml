[package]
name = "gray-tools"
version.workspace = true
edition.workspace = true
rust-version.workspace = true

[dependencies]
gray-core = { workspace = true }
async-trait = { workspace = true }
serde_json = { workspace = true }
log = { workspace = true }
tokio = { workspace = true }
tokio-util = { workspace = true }
tempfile = { workspace = true }
uuid = { workspace = true }
libc = { workspace = true }
ignore = { workspace = true }
globset = { workspace = true }
regex = { workspace = true }
base64 = { workspace = true }
image = { workspace = true }

# Job Objects own native shell descendants; POSIX process groups cannot model
# Windows cancellation. Keep Win32 APIs out of Unix builds.
[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = ["Win32_Foundation", "Win32_Security", "Win32_System_JobObjects", "Win32_System_Threading", "Win32_System_Diagnostics_ToolHelp"] }
