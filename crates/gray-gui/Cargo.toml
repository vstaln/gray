[package]
name = "gray-gui"
version = "0.1.0"
edition = "2024"
rust-version = "1.91"
license = "MIT"
publish = false

[[bin]]
name = "gray-gui"
path = "src/main.rs"

[dependencies]
gpui-kit = { version = "=0.7.3", features = ["tree-sitter"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
anyhow = "1"
uuid = { version = "1", features = ["v4"] }
chrono = "0.4"
env_logger = "0.11"

[workspace]
