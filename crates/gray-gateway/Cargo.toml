[package]
name = "gray-gateway"
version.workspace = true
edition.workspace = true
description = "gray gateway daemon for Discord"
license.workspace = true

[dependencies]
tokio = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
serde_yaml = "0.9"
anyhow = { workspace = true }
async-trait = { workspace = true }
chrono = { workspace = true }
log = { workspace = true }
gray-core = { workspace = true }
gray-session = { workspace = true }
gray-provider = { workspace = true }
gray-tools = { workspace = true }
futures = { workspace = true }
uuid = { workspace = true }
tokio-util = { workspace = true }
base64 = { workspace = true }
# Optional real platform deps (feature-gated; default build stays offline-friendly)
twilight-gateway = { version = "0.17", optional = true }
twilight-http = { version = "0.17", optional = true }
twilight-model = { version = "0.17", optional = true }
twilight-util = { version = "0.17.0", features = ["builder"], optional = true }

[features]
default = []
discord = ["dep:twilight-gateway", "dep:twilight-http", "dep:twilight-model", "dep:twilight-util"]

[dev-dependencies]
tempfile = { workspace = true }
